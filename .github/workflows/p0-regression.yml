name: P0 Regression Check

on:
  push:
    branches:
      - fix/p0-harden-do-extraction
    paths-ignore:
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile changed modules
        run: python -m py_compile core/llm_client.py tests/test_heuristic_fallback.py
      - name: Run tests
        run: pytest -q
